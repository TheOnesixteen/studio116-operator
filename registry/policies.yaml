allowed_without_approval:
  - inspect_files
  - read_logs
  - run_tests
  - create_branches
  - create_worktrees
  - draft_patches
  - prepare_deploy_steps
  - docker_ps
  - docker_logs
  - service_status_checks

live_codex_docs_only_allowed_targets:
  - README.md
  - OPERATOR.md
  - AGENTS.md

live_codex_tests_only_allowed_targets:
  - tests/test_*.py

live_codex_tests_only_disallowed_import_roots:
  - boto3
  - botocore
  - docker
  - fabric
  - ftplib
  - http
  - kubernetes
  - paramiko
  - requests
  - socket
  - smtplib
  - telnetlib
  - urllib

live_codex_tests_only_disallowed_calls:
  - os.popen
  - os.system
  - pty.spawn
  - subprocess.call
  - subprocess.check_call
  - subprocess.check_output
  - subprocess.Popen
  - subprocess.run

live_codex_tests_only_disallowed_string_tokens:
  - curl
  - deploy-combs
  - deploy-kairoke
  - deploy-katie
  - deploy-kensington
  - deploy-robin
  - deploy-rustyo
  - deploy-ski
  - deploy-studio
  - deploy-trouper
  - docker
  - docker compose
  - docker-compose
  - ssh
  - systemctl
  - wget

live_codex_tests_only_disallowed_path_prefixes:
  - /etc/
  - /home/
  - /opt/
  - /root/
  - /srv/
  - /usr/
  - /var/

live_codex_tests_only_allowed_path_prefixes:
  - /root/Projects/studio116-operator
  - /tmp/

live_codex_tests_only_disallowed_host_literals:
  - 159.65.187.30
  - combsplumbing.com
  - do.116.studio
  - kairoke.com
  - kdomusic.com
  - kensingtonpool.com
  - robinolinger.com
  - skilagrange.com

live_codex_policy_file_allowed_targets:
  - app/policies.py

live_codex_policy_file_disallowed_import_roots:
  - boto3
  - botocore
  - docker
  - fabric
  - ftplib
  - http
  - kubernetes
  - paramiko
  - requests
  - shutil
  - socket
  - smtplib
  - subprocess
  - telnetlib
  - urllib

live_codex_policy_file_disallowed_calls:
  - os.popen
  - os.remove
  - os.removedirs
  - os.rmdir
  - os.system
  - pty.spawn
  - shutil.rmtree
  - subprocess.call
  - subprocess.check_call
  - subprocess.check_output
  - subprocess.Popen
  - subprocess.run
  - unlink
  - rmdir

live_codex_policy_file_required_symbols:
  - BLOCKED_PHASE1_ACTIONS
  - LIVE_CODEX_DOCS_ONLY_MODE
  - LIVE_CODEX_TESTS_ONLY_MODE
  - LIVE_CODEX_POLICY_FILE_ONLY_MODE
  - LIVE_CODEX_MAX_CHANGED_FILES
  - READ_ONLY_ACTIONS
  - _read_yaml_list
  - assert_phase1_allowed
  - is_forbidden_live_codex_path
  - live_codex_allowed_targets_for_mode
  - validate_live_codex_changed_files_for_mode
  - validate_live_codex_paths_for_mode
  - validate_live_codex_policy_file_content
  - validate_live_codex_tests_only_content

requires_approval:
  - deploy_to_production
  - systemctl_restart
  - systemctl_stop
  - docker_compose_down
  - docker_system_prune
  - rm_rf_anything
  - edit_caddy_config
  - edit_live_env_files
  - dns_or_ssl_changes
  - delete_database_records

never_allowed:
  - delete_production_data
  - expose_api_keys_in_output
  - expose_secrets_in_logs
  - auto_deploy_without_approval
  - run_unknown_scripts_from_internet
  - fake_success_for_unverified_steps

retry_policy:
  max_blind_retry_count_per_step: 2
  max_major_approach_attempts: 2
  max_rabbit_hole_minutes: 30
  max_silent_execution_minutes: 5

lock_policy:
  authority: sqlite
  stale_lock_visibility_required: true
  scheduler_owns_locks: true
